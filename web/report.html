<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909"><title>Run evidence · CTRL Loop</title>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/report.css">
  <script type="module" src="/report.js"></script>
</head>
<body class="report-body">
  <header class="report-header"><a class="brand" href="/"><span class="brand-mark">[CTRL]</span><span>Loop.</span></a><div class="report-context"><span id="report-person">RUN EVIDENCE</span><label class="sr-only" for="report-company">Current company</label><select id="report-company" hidden></select><span id="report-company-name"></span></div><a class="button quiet small" href="/">Back to company ↗</a></header>
  <main class="report-main">
    <div id="report-loading" role="status">Loading the available run record…</div>
    <form id="report-login" hidden class="report-card"><h1>Sign in to view this report</h1><label for="report-username">Username</label><input id="report-username" autocomplete="username" required minlength="2" maxlength="64"><label for="report-password">Password</label><input id="report-password" type="password" autocomplete="current-password" required><button id="report-login-submit" class="button primary">Open report</button><a class="button quiet small" href="/">Activate an account ↗</a><p id="login-error" role="alert"></p></form>
    <div id="report-content" hidden></div>
  </main>
</body>
</html>
